# Host config for the CS8409 layout 57 filter-chain.
#
# Own PipeWire client (not the daemon, not PipeWire's stock filter-chain.conf)
# so the graph can start/stop without restarting pipewire-pulse.
# Graph fragments load from cs8409-speaker-tuning.conf.d/.
#
# Minimum modules a filter-hosting client needs, from
# /usr/share/pipewire/filter-chain.conf.

context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        args = { }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
]
