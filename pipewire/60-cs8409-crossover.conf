# MacBookPro14,3: stereo sink for apps, 4ch crossover to the hardware.
# FL/FR = tweeters (DAC 0x02), RL/RR = woofers (DAC 0x03). Stereo into both
# DACs without this split sounds hollow (midrange cancellation).
context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "MacBook speakers"
            media.name       = "MacBook speakers"
            filter.graph = {
                nodes = [
                    { name = copyIL type = builtin label = copy }
                    { name = copyIR type = builtin label = copy }
                    {
                        name = hpL
                        type = builtin
                        label = bq_highpass
                        control = { "Freq" = 1400.0 "Q" = 0.707 }
                    }
                    {
                        name = hpR
                        type = builtin
                        label = bq_highpass
                        control = { "Freq" = 1400.0 "Q" = 0.707 }
                    }
                    {
                        name = lpL
                        type = builtin
                        label = bq_lowpass
                        control = { "Freq" = 1400.0 "Q" = 0.707 }
                    }
                    {
                        name = lpR
                        type = builtin
                        label = bq_lowpass
                        control = { "Freq" = 1400.0 "Q" = 0.707 }
                    }
                    {
                        name = bassL
                        type = builtin
                        label = bq_lowshelf
                        control = { "Freq" = 180.0 "Q" = 0.7 "Gain" = 4.0 }
                    }
                    {
                        name = bassR
                        type = builtin
                        label = bq_lowshelf
                        control = { "Freq" = 180.0 "Q" = 0.7 "Gain" = 4.0 }
                    }
                    { name = invL type = builtin label = invert }
                    { name = invR type = builtin label = invert }
                ]
                links = [
                    { output = "copyIL:Out" input = "hpL:In" }
                    { output = "copyIR:Out" input = "hpR:In" }
                    { output = "copyIL:Out" input = "lpL:In" }
                    { output = "copyIR:Out" input = "lpR:In" }
                    { output = "lpL:Out" input = "bassL:In" }
                    { output = "lpR:Out" input = "bassR:In" }
                    { output = "bassL:Out" input = "invL:In" }
                    { output = "bassR:Out" input = "invR:In" }
                ]
                inputs  = [ "copyIL:In" "copyIR:In" ]
                outputs = [ "hpL:Out" "hpR:Out" "invL:Out" "invR:Out" ]
            }
            capture.props = {
                node.name             = "cs8409_speakers"
                node.description      = "MacBook speakers"
                media.class           = "Audio/Sink"
                audio.position        = [ FL FR ]
                audio.channels        = 2
                audio.rate            = 44100
                priority.session      = 1400
                priority.driver       = 1400
            }
            playback.props = {
                node.name             = "cs8409_speakers.playback"
                media.class           = "Stream/Output/Audio"
                audio.position        = [ FL FR RL RR ]
                audio.channels        = 4
                audio.rate            = 44100
                stream.dont-remix     = true
                node.passive          = true
                node.dont-fallback    = true
                target.object         = "alsa_output.pci-0000_00_1f.3.analog-surround-40"
            }
        }
    }
]
