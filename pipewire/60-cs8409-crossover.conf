# MacBookPro14,3: stereo sink → 4ch codec.
# Internal-mic sweep (equal digital tones) showed a ~26 dB hole at 1 kHz
# (crossover) and weak 80–315 Hz. LR4 in-phase should be flat at fc; a
# notch means acoustic polarity is inverted — flip the woofers.
# Split at 800 Hz (woofers already strong at 500–800 in that sweep).
# FL/FR tweeters DAC 0x02 ch0; RL/RR woofers DAC 0x03 ch2.
context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "MacBook speakers"
            media.name       = "MacBook speakers"
            filter.graph = {
                nodes = [
                    { name = copyIL type = builtin label = copy }
                    { name = copyIR type = builtin label = copy }
                    {
                        name = hpL1
                        type = builtin
                        label = bq_highpass
                        control = { "Freq" = 800.0 "Q" = 0.707 }
                    }
                    {
                        name = hpL2
                        type = builtin
                        label = bq_highpass
                        control = { "Freq" = 800.0 "Q" = 0.707 }
                    }
                    {
                        name = hpR1
                        type = builtin
                        label = bq_highpass
                        control = { "Freq" = 800.0 "Q" = 0.707 }
                    }
                    {
                        name = hpR2
                        type = builtin
                        label = bq_highpass
                        control = { "Freq" = 800.0 "Q" = 0.707 }
                    }
                    {
                        name = lpL1
                        type = builtin
                        label = bq_lowpass
                        control = { "Freq" = 800.0 "Q" = 0.707 }
                    }
                    {
                        name = lpL2
                        type = builtin
                        label = bq_lowpass
                        control = { "Freq" = 800.0 "Q" = 0.707 }
                    }
                    {
                        name = lpR1
                        type = builtin
                        label = bq_lowpass
                        control = { "Freq" = 800.0 "Q" = 0.707 }
                    }
                    {
                        name = lpR2
                        type = builtin
                        label = bq_lowpass
                        control = { "Freq" = 800.0 "Q" = 0.707 }
                    }
                    {
                        name = bassL
                        type = builtin
                        label = bq_lowshelf
                        control = { "Freq" = 150.0 "Q" = 0.7 "Gain" = 6.0 }
                    }
                    {
                        name = bassR
                        type = builtin
                        label = bq_lowshelf
                        control = { "Freq" = 150.0 "Q" = 0.7 "Gain" = 6.0 }
                    }
                    { name = invL type = builtin label = invert }
                    { name = invR type = builtin label = invert }
                ]
                links = [
                    { output = "copyIL:Out" input = "hpL1:In" }
                    { output = "hpL1:Out" input = "hpL2:In" }
                    { output = "copyIR:Out" input = "hpR1:In" }
                    { output = "hpR1:Out" input = "hpR2:In" }
                    { output = "copyIL:Out" input = "lpL1:In" }
                    { output = "lpL1:Out" input = "lpL2:In" }
                    { output = "copyIR:Out" input = "lpR1:In" }
                    { output = "lpR1:Out" input = "lpR2:In" }
                    { output = "lpL2:Out" input = "bassL:In" }
                    { output = "lpR2:Out" input = "bassR:In" }
                    { output = "bassL:Out" input = "invL:In" }
                    { output = "bassR:Out" input = "invR:In" }
                ]
                inputs  = [ "copyIL:In" "copyIR:In" ]
                outputs = [ "hpL2:Out" "hpR2:Out" "invL:Out" "invR:Out" ]
            }
            capture.props = {
                node.name             = "cs8409_speakers"
                node.description      = "MacBook speakers"
                media.class           = "Audio/Sink"
                audio.position        = [ FL FR ]
                audio.channels        = 2
                audio.rate            = 44100
                priority.session      = 1400
                priority.driver       = 1400
            }
            playback.props = {
                node.name             = "cs8409_speakers.playback"
                media.class           = "Stream/Output/Audio"
                audio.position        = [ FL FR RL RR ]
                audio.channels        = 4
                audio.rate            = 44100
                stream.dont-remix     = true
                channelmix.disable    = true
                node.passive          = true
                node.dont-fallback    = true
                target.object         = "alsa_output.pci-0000_00_1f.3.analog-surround-40"
            }
        }
    }
]
