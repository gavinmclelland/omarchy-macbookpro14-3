# CS8409: 4ch hardware for the crossover, but never the app-visible default.
# Apps play into the stereo filter-chain sink (cs8409_speakers).
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.pci-0000_00_1f.3" }
    ]
    actions = {
      update-props = {
        device.profile = "output:analog-surround-40+input:analog-stereo"
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.pci-0000_00_1f.3.analog-surround-40" }
    ]
    actions = {
      update-props = {
        node.description = "MacBook speakers (raw 4ch)"
        # Sinks default ~600–1000. Stay far below the filter sink (~1400)
        # so Spotify/Chromium never pick 4ch as the session default.
        priority.session = 1
        priority.driver = 1
        # Pass 4 PCM slots through. ACP advertises FL,FR,LFE,LFE which
        # would remix RL/RR away if channelmix is on.
        audio.position = [ FL, FR, RL, RR ]
        channelmix.disable = true
        # App volume is cs8409_speakers. Do not let this node be a second fader.
        node.volume = 1.0
      }
    }
  }
]
