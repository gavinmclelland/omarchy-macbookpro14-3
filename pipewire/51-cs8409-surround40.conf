# Open CS8409 as 4-channel so woofers are not silent / not full-range clones.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.pci-0000_00_1f.3" }
    ]
    actions = {
      update-props = {
        device.profile = "output:analog-surround-40+input:analog-stereo"
      }
    }
  }
]
