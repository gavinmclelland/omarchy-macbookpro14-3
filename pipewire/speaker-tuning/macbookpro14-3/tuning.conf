## MacBookPro14,3 (A1707) internal speakers.
##
## AppleHDA layout 57 on CS8409 + CS42L83 + four MAX98706. The codec does no
## crossover: this graph is stereo-in / 4ch-out (tweeters FL/FR, woofers RL/RR),
## then a lookahead limiter on the 2ch bus and a hard clamp per driver.
##
## DMI product SKU is empty on this machine, so match on product name. That
## string is this chassis only (not MacBookPro14,2).

description="MacBookPro14,3 (A1707) speakers"
match_dmi=("MacBookPro14,3")
## Unescaped dots: this is passed to awk as a string.
sink_pattern='^alsa_output.*analog-surround-40$'

derived_from="AppleHDA layout 57 (MAX98706), this machine"
validated_by="gavinmclelland"
validated_on="2026-08-27"
validated_hardware="MacBookPro14,3 A1707 CS8409 0x10138409 / 0x106b3900"

## Electrical split + lid-mic tones vs 500 Hz. Mozart / BuzzKill / ControlFreak
## / thermal are not cloned. limiter_headroom is LSP g_in/th (0.5456 / 0.891)
## plus clamp ±0.98; re-measure after the host is live.
magnitude_rms_db=""
bass_group_delay_swing_ms=""
limiter_headroom_db="1.0"
dynamic_range_delta_lu=""
