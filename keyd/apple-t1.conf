# T1 SPI keyboard: no physical Esc (that key is the left Touch Bar slot).
# Fn is a layer: hold+` → Esc (backup). Chord fn+grave (50 ms) still types `.
#
# keyd grabs the SPI keyboard, so apple_ib_tb never sees KEY_FN.
# systemd/touchbar-fn.service watches this "fn" layer and writes fnmode 0/1.
# Keep the layer name "fn".
[ids]
0000:0000:1bf79592

[main]
fn = layer(fn)

[fn]
grave = esc
