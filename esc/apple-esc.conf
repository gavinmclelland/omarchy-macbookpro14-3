# T1 MacBookPro: hold Fn, tap ` → Escape (backup; the Touch Bar also has Esc).
# fn+grave as a chord is simultaneous-press-within-50ms and still types backtick.
# Make Fn a layer instead.
# apple_ib_tb still sees KEY_FN on the raw SPI keyboard (handler tbkbd) so
# holding Fn also switches the Touch Bar to F-keys when fnmode=1.
[ids]
0000:0000:1bf79592

[main]
fn = layer(fn)

[fn]
grave = esc
