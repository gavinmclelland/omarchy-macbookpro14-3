# T1 MacBookPro (no physical Esc): hold Fn, tap ` → Escape.
# fn+grave as a chord is simultaneous-press-within-50ms, which is not
# how people type Fn combos. Make Fn a layer instead.
#
# keyd grabs the SPI keyboard, so apple_ib_tb never sees KEY_FN.
# touchbar-fn.service watches this "fn" layer and writes fnmode 0/1.
# Keep the layer name "fn" — the watcher matches +fn / -fn from keyd listen.
[ids]
0000:0000:1bf79592

[main]
fn = layer(fn)

[fn]
grave = esc
